name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9","3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Lint
        run: python -m ruff check auto_modeling_tool scripts tests
      - name: Compile source and tests
        run: python -m compileall -q auto_modeling_tool scripts tests
      - name: Run test suite
        run: python -m pytest tests -q

